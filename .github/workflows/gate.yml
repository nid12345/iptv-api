name: 'Quality gate'

# 对将要发布的订阅做质量守门。
#
# 目标文件固定为 output/user_result.txt —— 它由 Cloudflare Worker
# (tvlive.nide.qzz.io) 直接对外提供，因此这里**原地更新**该文件
# （原文件另备份为 user_result.raw.txt），下游链路无需任何改动。
#
# 重要限制：GitHub Actions 的 runner 在海外，测国内源会把可用源
# 大面积误判为不可用，所以这里只做结构性过滤（协议 / 去重 / 域名集中度），
# 且不削减每频道条数（没有质量信息时剪枝只会降低命中率）。
#
# 完整质量探测（headroom 实测）必须在**国内网络**的机器上执行：
#     python gate.py --src output/user_result.raw.txt \
#                    --dst output/user_result.txt \
#                    --min-headroom 1.5 --max-per-channel 8 \
#                    --report output/gate_report.json

on:
  workflow_run:
    workflows: ["Update schedule"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Structural gate for user_result.txt (in place)
        run: |
          set -e
          if [ ! -f output/user_result.txt ]; then
            echo "user_result.txt 不存在，跳过"; exit 0
          fi
          cp output/user_result.txt output/user_result.raw.txt
          python gate.py --src output/user_result.raw.txt \
                         --dst output/user_result.txt \
                         --no-network \
                         --max-per-channel 40 \
                         --host-ratio 1.0 \
                         --report output/gate_report.json

      - name: Commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/user_result.txt output/user_result.raw.txt output/gate_report.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Quality gate: refresh user_result.txt"
            git push
          fi
